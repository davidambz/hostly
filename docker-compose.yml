name: hostly

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hostly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hostly}
      POSTGRES_DB: ${POSTGRES_DB:-hostly}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    restart: unless-stopped
    init: true
    env_file:
      - path: apps/api/.env
        required: false
    # HOST, PORT and DATABASE_URL are fixed inside the container (they win over
    # apps/api/.env); change the published port with API_PORT in the root .env.
    environment:
      HOST: 0.0.0.0
      PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER:-hostly}:${POSTGRES_PASSWORD:-hostly}@postgres:5432/${POSTGRES_DB:-hostly}
      # Development only: the API refuses this secret when NODE_ENV=production.
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-in-any-real-env}
      # Dropped and recreated by the integration tests (`pnpm test` inside the container).
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-hostly}:${POSTGRES_PASSWORD:-hostly}@postgres:5432/${POSTGRES_DB:-hostly}_test
    ports:
      - 127.0.0.1:${API_PORT:-3333}:3333
    volumes:
      - ./apps/api/src:/repo/apps/api/src
      - ./apps/api/prisma:/repo/apps/api/prisma
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
