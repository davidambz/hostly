name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  docker:
    name: Docker images (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [dev, prod]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: ${{ matrix.target }}
          tags: hostly-api:${{ matrix.target }}
          load: true
          cache-from: type=gha,scope=api-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=api-${{ matrix.target }}

      - name: Smoke test the container
        run: |
          docker run -d --name api -p 3333:3333 hostly-api:${{ matrix.target }}
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3333/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs api
          exit 1

      - name: Wait for the HEALTHCHECK
        if: matrix.target == 'prod'
        run: |
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' api)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          echo "container is $status"
          docker logs api
          exit 1
