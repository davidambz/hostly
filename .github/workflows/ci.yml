name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hostly
          POSTGRES_PASSWORD: hostly
          POSTGRES_DB: hostly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hostly"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://hostly:hostly@localhost:5432/hostly_test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: Check the API contract and the web types are up to date
        run: |
          pnpm --filter @hostly/api openapi:export
          pnpm --filter @hostly/web api:types
          git diff --exit-code -- apps/api/openapi.json apps/web/src/lib/api/schema.d.ts

      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETWORK: hostly-ci
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build dev
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: dev
          tags: hostly-api:dev
          load: true
          cache-from: type=gha,scope=api

      - name: Build migrate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          tags: hostly-api:migrate
          load: true
          cache-from: type=gha,scope=api

      - name: Build prod
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          target: prod
          tags: hostly-api:prod
          load: true
          cache-from: type=gha,scope=api
          # One shared scope; the prod chain covers every stage except the tiny dev/migrate tails.
          cache-to: type=gha,mode=max,scope=api

      - name: Build web dev
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          target: dev
          tags: hostly-web:dev
          load: true
          cache-from: type=gha,scope=web

      - name: Build web prod
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          target: prod
          tags: hostly-web:prod
          load: true
          cache-from: type=gha,scope=web
          # One shared scope; the prod chain covers every stage except the tiny dev tail.
          cache-to: type=gha,mode=max,scope=web

      - name: Smoke test the web images
        run: |
          docker run -d --name web-prod -p 8080:8080 hostly-web:prod
          docker run -d --name web-dev -p 5173:5173 hostly-web:dev
          for _ in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' web-prod)" = healthy ] \
              && curl -fsS http://127.0.0.1:8080/some/client/route | grep -q '<div id="root">' \
              && curl -fsS http://127.0.0.1:5173/ | grep -q '<div id="root">'; then
              exit 0
            fi
            sleep 2
          done
          docker logs web-prod
          docker logs web-dev
          exit 1

      - name: Start Postgres
        run: |
          docker network create "$NETWORK"
          docker run -d --name postgres --network "$NETWORK" \
            -e POSTGRES_USER=hostly -e POSTGRES_PASSWORD=hostly -e POSTGRES_DB=hostly \
            --health-cmd 'pg_isready -U hostly' --health-interval 2s \
            postgres:18-alpine
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' postgres)" = healthy ] && exit 0
            sleep 1
          done
          exit 1

      - name: Run migrations with the migrate image
        run: |
          docker run --rm --network "$NETWORK" \
            -e DATABASE_URL=postgresql://hostly:hostly@postgres:5432/hostly \
            hostly-api:migrate

      - name: Smoke test the prod image
        run: |
          docker run -d --name api-prod --network "$NETWORK" -p 3333:3333 \
            -e DATABASE_URL=postgresql://hostly:hostly@postgres:5432/hostly \
            -e JWT_SECRET=ci-secret-that-is-at-least-32-characters-long \
            hostly-api:prod
          for _ in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' api-prod)" = healthy ]; then
              curl -fsS http://127.0.0.1:3333/health && exit 0
            fi
            sleep 2
          done
          docker logs api-prod
          exit 1

      - name: Smoke test the dev image
        run: |
          docker exec postgres psql -U hostly -c 'CREATE DATABASE hostly_dev'
          docker run -d --name api-dev --network "$NETWORK" -p 3334:3333 \
            -e DATABASE_URL=postgresql://hostly:hostly@postgres:5432/hostly_dev \
            -e JWT_SECRET=dev-only-ci-secret-that-is-at-least-32-chars \
            hostly-api:dev
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3334/health && exit 0
            sleep 1
          done
          docker logs api-dev
          exit 1
