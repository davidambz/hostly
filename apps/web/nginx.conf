server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;
  # Locations that add their own headers still get these (nginx >= 1.29.3).
  add_header_inherit merge;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # The rest of the policy is a <meta> in index.html; these parts only work as a header.
  add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
  # Browsers only honour it over HTTPS (the TLS proxy in front), where it pins HTTPS for a year.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Hashed file names: safe to cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    # Stripe's card fields load the app's font from their own frame.
    add_header Access-Control-Allow-Origin "https://js.stripe.com" always;
    try_files $uri =404;
  }

  # The install manifest: its own type, and never cached, so a change to it shows up.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Client-side routes all serve the app; index.html is never cached so deploys show up.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
