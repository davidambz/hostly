<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Neon de vagas</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1440px;
        height: 900px;
        font-family: system-ui, sans-serif;
        background: #0b1a27;
        color: #e8f1f2;
        overflow: hidden;
      }
      .neon {
        position: absolute;
        top: 110px;
        left: 64px;
        font:
          700 140px/1 'Brush Script MT',
          cursive;
        color: #8fd8ff;
        text-shadow:
          0 0 12px #1b98e0,
          0 0 40px #1b98e0;
      }
      .sign {
        position: absolute;
        top: 120px;
        right: 80px;
        border: 4px solid #1b98e0;
        border-radius: 18px;
        padding: 22px 34px;
        font: 800 44px system-ui;
        letter-spacing: 0.12em;
        color: #8fd8ff;
        text-shadow: 0 0 16px #1b98e0;
        box-shadow: 0 0 30px #1b98e033;
      }
      h1 {
        position: absolute;
        top: 330px;
        left: 64px;
        width: 640px;
        font-size: 52px;
        line-height: 1.05;
      }
      .cta {
        position: absolute;
        top: 500px;
        left: 64px;
        background: #1b98e0;
        color: #0b1a27;
        padding: 18px 28px;
        font-weight: 800;
        font-size: 22px;
        border-radius: 10px;
        box-shadow: 0 0 30px #1b98e088;
      }
      .month {
        position: absolute;
        top: 620px;
        left: 64px;
        right: 64px;
        display: grid;
        grid-template-columns: repeat(31, 1fr);
        gap: 6px;
      }
      .n {
        height: 120px;
        border-radius: 6px;
        border: 2px solid #24425a;
      }
      .n.lit {
        border-color: #1b98e0;
        box-shadow: 0 0 18px #1b98e0aa;
        background: #1b98e022;
      }
    </style>
  </head>
  <body>
    <div class="neon">Hostly</div>
    <div class="sign">HÁ VAGAS</div>
    <h1>As noites livres acendem. As ocupadas, apagam.</h1>
    <div class="cta">Criar conta</div>
    <div class="month"></div>
    <script>
      const m = document.querySelector('.month')
      for (let i = 0; i < 31; i++) {
        const d = document.createElement('div')
        d.className = 'n' + (i < 3 || (i > 11 && i < 15) || i > 27 ? ' lit' : '')
        m.appendChild(d)
      }
    </script>
  </body>
</html>
